# Chạy bộ kiểm thử SpineInsight AI trên mỗi lần push / pull request.
# SUT được clone từ bản trên GitLab (lumbar-spine/spineinsight_ai) vào ./sut tại đúng commit đã chốt để kiểm thử.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mutation:
        description: 'Chạy thêm mutation testing (StrykerJS)'
        type: boolean
        default: false

env:
  SUT_REPOSITORY: lumbar-spine/spineinsight_ai
  # Commit 38ee7f1 (nhánh vietvq): phiên bản SUT được chốt để kiểm thử.
  SUT_REF: 38ee7f10484b56ac5a9ad15383d15f9333e36d2b
  SUT_DIR: ./sut

jobs:
  backend:
    name: Backend (Jest + Supertest + Istanbul)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kho GitLab private: khai báo SUT_GITLAB_USER và SUT_GITLAB_TOKEN (deploy token, scope read_repository)
      # trong Settings > Secrets and variables > Actions. Kho public thì để trống.
      - name: Checkout SUT
        env:
          GITLAB_USER: ${{ secrets.SUT_GITLAB_USER }}
          GITLAB_TOKEN: ${{ secrets.SUT_GITLAB_TOKEN }}
        run: |
          rm -rf sut
          auth=""
          if [ -n "$GITLAB_TOKEN" ]; then auth="${GITLAB_USER}:${GITLAB_TOKEN}@"; fi
          git clone --quiet "https://${auth}gitlab.com/${SUT_REPOSITORY}.git" sut
          git -C sut checkout --quiet "$SUT_REF"
          git -C sut remote set-url origin "https://gitlab.com/${SUT_REPOSITORY}.git"
          git -C sut log -1 --format='SUT %h %s'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sut/backend/package-lock.json

      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: sut/backend

      - run: npm run test:backend:cov

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: reports/coverage/backend

  frontend:
    name: Frontend (Vitest + fast-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout SUT
        env:
          GITLAB_USER: ${{ secrets.SUT_GITLAB_USER }}
          GITLAB_TOKEN: ${{ secrets.SUT_GITLAB_TOKEN }}
        run: |
          rm -rf sut
          auth=""
          if [ -n "$GITLAB_TOKEN" ]; then auth="${GITLAB_USER}:${GITLAB_TOKEN}@"; fi
          git clone --quiet "https://${auth}gitlab.com/${SUT_REPOSITORY}.git" sut
          git -C sut checkout --quiet "$SUT_REF"
          git -C sut remote set-url origin "https://gitlab.com/${SUT_REPOSITORY}.git"
          git -C sut log -1 --format='SUT %h %s'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sut/frontend/package-lock.json

      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: sut/frontend

      - run: npm run test:frontend:cov

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: reports/coverage/frontend

  mutation:
    name: Mutation (StrykerJS)
    # Chạy lâu hơn nên chỉ bật khi kích hoạt thủ công (Actions > test > Run workflow > mutation).
    if: github.event_name == 'workflow_dispatch' && inputs.mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout SUT
        env:
          GITLAB_USER: ${{ secrets.SUT_GITLAB_USER }}
          GITLAB_TOKEN: ${{ secrets.SUT_GITLAB_TOKEN }}
        run: |
          rm -rf sut
          auth=""
          if [ -n "$GITLAB_TOKEN" ]; then auth="${GITLAB_USER}:${GITLAB_TOKEN}@"; fi
          git clone --quiet "https://${auth}gitlab.com/${SUT_REPOSITORY}.git" sut
          git -C sut checkout --quiet "$SUT_REF"
          git -C sut remote set-url origin "https://gitlab.com/${SUT_REPOSITORY}.git"
          git -C sut log -1 --format='SUT %h %s'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sut/backend/package-lock.json

      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: sut/backend

      - run: npm run test:mutation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
